name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tool name, arguments (redact addresses and keys) and the result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Deployment
      options: [ChatGPT Sites, Cloudflare Workers, Local wrangler, Other]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: ChatGPT / Claude Code / Cursor / SDK …
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
